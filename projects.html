<main class="bg-polarBlue-50  text-polarBlue-900">
	<div class="flex flex-col p-8 gap-4">
		<h1 class="font-bold text-3xl">Project Ninja API Demonstrator</h1>

		<form id="apiToolForm">
			<!-- So much wrong here, like baselines not matching -->
			<div class="labeledBlock">
				<span class="font-medium">Select Ninja API: </span>
				<div>
					<div>
						<input type="checkbox" name="checkGroupE" id="exercisesCB" value="exercises" class="checkGroup">
						<label for="exercisesCB" class="font-medium">Exercises</label>
					</div>
					<div>
						<input type="checkbox" name="checkGroupP" id="validatePhoneCB" value="phone" class="checkGroup">
						<label for="validatePhoneCB" class="font-medium">Validate Phone</label>
					</div>
				</div>
			</div>
			<div class="labeledBlock">
				<span><label for="queryString" class="font-medium">Query:</label></span>
				<div>
					<input type="text" id="queryString" size="30" placeholder="First, select an API">
				</div>
			</div>
			<div class="labeledBlock">
				<span></span>
				<div class="buttonRow">
					<button type="submit" id="executeButton" class="self-center w-auto inline-flex font-medium flex-shrink-0 px-5 py-0 m-4 rounded-2xl border-2 bg-white border-black hover:border-polarBlue-500 text-black font-bold hover:text-polarBlue-500 transition duration-100 ease-in-out">
						Execute</button>
					<button type="button" id="clearButton">Clear Result</button>
				</div>
			</div>
			<div class="labeledBlock">
				<span><label for="responseString" class="font-medium">Response:</label></span>
				<div>
					<textarea id="responseString" readonly rows="15" cols="60"></textarea>
				</div>
			</div>
		</form>
	</div>
</main>
